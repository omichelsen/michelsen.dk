<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>michelsen.dk</title>
<meta name="description" content="Domain hosting of personal websites and services for the Michelsen family name.">
<meta name="author" content="Ole Bjørn Michelsen">
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f6f6f4;
    color: #1c1c1e;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  main { width: 100%; max-width: 480px; padding: 2rem 1.25rem; }
  h1 { font-size: 2rem; font-weight: 700; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
  p.sub { margin: 0 0 2rem; color: #6e6e73; }
  h2 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #6e6e73; margin: 0 0 0.75rem; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
  a.card {
    display: block;
    padding: 1.1rem 1.25rem;
    background: #ffffff;
    border: 1px solid #e3e3e0;
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
  }
  a.card:hover { border-color: #b9b9b4; }
  a.card h3 { margin: 0 0 0.2rem; font-size: 1.15rem; color: #0b5cad; }
  a.card p { margin: 0; color: #6e6e73; font-size: 0.95rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #161617; color: #f5f5f7; }
    a.card { background: #1d1d1f; border-color: #333336; }
    a.card:hover { border-color: #55555a; }
    a.card h3 { color: #4da3ff; }
  }
</style>
</head>
<body>
<main>
  <h1>michelsen.dk</h1>
  <p class="sub">Personal websites and services for the Michelsen family.</p>

  <h2>Hosted sites</h2>
  <ul>
    <li>
      <a class="card" href="https://ole.michelsen.dk/">
        <h3>ole.michelsen.dk</h3>
        <p>Ole Bjørn Michelsen's personal site</p>
      </a>
    </li>
    <li>
      <a class="card" href="https://mail.google.com/">
        <h3>Webmail</h3>
        <p>Michelsen family email (Gmail)</p>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
